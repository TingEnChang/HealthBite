<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - HealthBite</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
        }

        .info-box {
            background: #fff8d6;
            border: 2px solid #f2d44c;
            padding: 20px;
            border-radius: 8px;
        }

        .info-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 95%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .password-group {
            margin-top: 20px;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn {
            width: 48%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back {
            background: #0078ff;
            color: white;
        }

        .btn-submit {
            background: #f2d44c;
            color: black;
        }

        .btn-back:hover {
            background: #005fcc;
        }

        .btn-submit:hover {
            background: #e5c23c;
        }
    </style>
</head>

<body>

    <div class="container">

        <form method="POST">
            {% csrf_token %}

            <div class="info-box">
                <h3>Please input your information</h3>

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Age</label>
                    <input type="number" name="age" placeholder="Enter your age">
                </div>

                <div class="input-group">
                    <label>Height</label>
                    <input type="text" name="height" placeholder="Enter your height">
                </div>

                <div class="input-group">
                    <label>Weight</label>
                    <input type="text" name="weight" placeholder="Enter your weight">
                </div>

                <div class="input-group">
                    <label>Activity Level</label>
                    <input type="text" name="activity_level" placeholder="Enter your activity level">
                </div>
            </div>

            <div class="password-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="button-row">
                <button type="button" class="btn btn-back"
                        onclick="window.location.href='/login/'">
                    Back
                </button>

                <button type="submit" class="btn btn-submit">
                    Submit
                </button>
            </div>

        </form>

    </div>

</body>
</html>
