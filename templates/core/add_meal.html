{% extends "core/base.html" %}
{% block title %}Add Meal — HealthBite{% endblock %}

{% block content %}
<h1>Add Meal</h1>

<form method="POST">
    {% csrf_token %}

    <label>Food:</label>
    <select name="food" required>
        {% for food in foods %}
            <option value="{{ food.id }}">
                {{ food.name }} - {{ food.calories_per_serving }} calories / {{ food.serving_unit }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Quantity:</label>
    <input type="number" step="0.1" name="quantity" required>

    <br><br>

    <button type="submit">Add Meal</button>
</form>

{% endblock %}
